 services:
   # Backend Service
   - type: web
     name: agribrain-backend
     env: python
     plan: starter
     buildCommand: "pip install -r requirements.txt"
     startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
     envVars:
       - key: DATABASE_URL
         fromDatabase:
           name: agribrain-db
           property: connectionString
       - key: DATAGOV_API_KEY
         sync: false
       - key: GOOGLE_API_KEY
         sync: false
       - key: WEATHER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
         value: "https://agribrain-frontend.onrender.com,https://*.onrender.com"
     healthCheckPath: /health
     autoDeploy: true
   
   # Frontend Service
   - type: web
     name: agribrain-frontend
     env: node
     plan: starter
     buildCommand: "cd frontend_web && npm install && npm run build"
     startCommand: "cd frontend_web && npm run start"
     envVars:
       - key: NEXT_PUBLIC_BACKEND_URL
         value: "https://agribrain-backend.onrender.com"
     healthCheckPath: /
     autoDeploy: true

 # PostgreSQL Database
 databases:
   - name: agribrain-db
     databaseName: agribrain
     user: agribrain_user
     plan: starter