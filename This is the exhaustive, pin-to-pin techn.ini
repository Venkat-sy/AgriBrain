## 3. LINE-BY-LINE FUNCTION LOGIC

### A. ML Pipeline Logic (`backend/ml/train.py`)

1. **Load Data**: `df = pd.read_csv('datasets/master_data.csv')`. Features: `N, P, K, pH, temp, humidity, rainfall`. Target: `crop`.
2. **Preprocessing**:
* `le = LabelEncoder()`; `df['crop_encoded'] = le.fit_transform(df['crop'])`
* `X = df.drop(['crop', 'crop_encoded'], axis=1)`
* `y = df['crop_encoded']`
* `scaler = StandardScaler()`; `X_scaled = scaler.fit_transform(X)`


3. **Training**:
* `rf_model = RandomForestClassifier(n_estimators=100, random_state=42)`
* `xgb_model = xgb.XGBClassifier(n_estimators=100, learning_rate=0.1, random_state=42)`
* Fit both models on `X_scaled, y`.


4. **Export**: Use `joblib.dump` to save `xgb_model`, `rf_model`, `scaler`, and `le` to `saved_models/`.

### B. The Simulation Orchestrator (`backend/api/simulation.py`)

**Function**: `async def run_simulation(req: SimulationRequest):`

1. **Geocode**: Call `spatial.get_district(req.lat, req.lng)`. (Hits `nominatim.openstreetmap.org/reverse?lat={lat}&lon={lng}`). Extracts `state_district`.
2. **Weather**: Call `weather.get_live_data(district)`. (Hits `weather.indianapi.in/india/weather?city={district}` with `WEATHER_API_KEY`). Returns `temp`, `humidity`, `rainfall`.
3. **Soil**: Lookup district soil in a local dictionary/DB. If missing, default to `N=150, P=40, K=120, pH=6.5`.
4. **ML Inference**:
* Load `xgb_model`, `scaler`, `le`.
* `input_array = np.array([[soil.N, soil.P, soil.K, soil.pH, weather.temp, weather.humidity, weather.rainfall]])`
* `scaled_input = scaler.transform(input_array)`
* `probabilities = xgb_model.predict_proba(scaled_input)[0]`
* Get top 3 crop indices: `top_indices = np.argsort(probabilities)[-3:][::-1]`


5. **Setup Type Filter**:
* If `req.setup_type == "long-term"`, filter top indices for crops like "apple", "banana", "coconut".
* If `short-term`, filter for "rice", "blackgram", "cotton".
* Assign winner to `final_crop_index`. `crop_name = le.inverse_transform([final_crop_index])[0]`.


6. **SHAP Explainability**:
* `explainer = shap.TreeExplainer(xgb_model)`
* `shap_values = explainer.shap_values(scaled_input)`
* Extract the highest absolute SHAP value for the predicted class. Map it back to the feature name (e.g., "Rainfall").


7. **LLM Timeline**: Call `groq_llm.generate_timeline(crop_name, district)`. Passes prompt to `llama3-8b-8192` enforcing strict JSON list output.
8. **Return**: Construct and return `SimulationResponse`.

