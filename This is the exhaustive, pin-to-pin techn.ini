## 2. STRICT PIN-TO-PIN DATA CONTRACTS

### A. Backend (Python Pydantic Schemas - `backend/schemas/api_models.py`)

```python
from pydantic import BaseModel, Field
from typing import List, Optional

class SimulationRequest(BaseModel):
    lat: float
    lng: float
    setup_type: str = Field(..., pattern="^(short-term|long-term)$")

class TimelineStage(BaseModel):
    stage_name: str
    days: int
    agronomy_advice: str

class SHAPExplanation(BaseModel):
    top_feature: str
    contribution: float
    reasoning: str

class SimulationResponse(BaseModel):
    district: str
    weather: dict = Field(default_factory=lambda: {"temp": 0.0, "humidity": 0.0, "rainfall": 0.0})
    soil: dict = Field(default_factory=lambda: {"N": 0.0, "P": 0.0, "K": 0.0, "pH": 0.0})
    recommended_crop: str
    confidence: float
    shap_data: SHAPExplanation
    timeline: List[TimelineStage]

```

### B. Frontend (TypeScript Interfaces - `frontend_web/src/types/index.ts`)

```typescript
export type SetupType = "short-term" | "long-term";

export interface SimulationPayload {
  lat: number;
  lng: number;
  setup_type: SetupType;
}

export interface TimelineStage {
  stage_name: string;
  days: number;
  agronomy_advice: string;
}

export interface SHAPData {
  top_feature: string;
  contribution: number;
  reasoning: string;
}

export interface SimulationResult {
  district: string;
  weather: { temp: number; humidity: number; rainfall: number };
  soil: { N: number; P: number; K: number; pH: number };
  recommended_crop: string;
  confidence: number;
  shap_data: SHAPData;
  timeline: TimelineStage[];
}

```

